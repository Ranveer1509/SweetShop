# ==============================
# Database Configuration
# Uses local H2 by default. For deployment, set DATABASE_URL, DB_USERNAME,
# DB_PASSWORD, DB_DRIVER, and DB_DIALECT in the hosting provider.
# ==============================

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sweetshop-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}


# ==============================
# Server Configuration
# ==============================

server.port=${PORT:8080}


# ==============================
# Logging
# ==============================

logging.level.root=INFO
logging.level.com.ranveer.sweetshop=DEBUG


# ==============================
# Swagger / OpenAPI
# ==============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.use-root-path=true
